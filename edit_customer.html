<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>កែប្រែអតិថិជន</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Khmer OS', 'Noto Sans Khmer', 'Moul', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #1a1a2e;
        }

        .header h1 span {
            color: #f39c12;
        }

        .header p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-group label .required {
            color: #e74c3c;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            font-family: 'Khmer OS', 'Noto Sans Khmer', Arial, sans-serif;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #f39c12;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(243, 156, 18, 0.1);
        }

        .form-group input::placeholder {
            color: #aaa;
            font-size: 13px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Khmer OS', 'Noto Sans Khmer', Arial, sans-serif;
        }

        .btn-submit {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: #fff;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(243, 156, 18, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-cancel {
            background: #e74c3c;
            color: #fff;
        }

        .btn-cancel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.4);
        }

        .alert {
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 18px;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #f39c12;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-actions {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ កែប្រែ <span>អតិថិជន</span></h1>
            <p>សូមកែប្រែព័ត៌មានខាងក្រោម</p>
        </div>

        <div id="alertMessage"></div>

        <div id="loadingMessage" class="loading">
            <div class="spinner"></div>
            កំពុងផ្ទុកទិន្នន័យ...
        </div>

        <form id="editForm" class="hidden" onsubmit="submitForm(event)">
            <input type="hidden" id="customer_id">

            <div class="form-grid">
                <!-- លេខកូដ -->
                <div class="form-group">
                    <label>លេខកូដ <span class="required">*</span></label>
                    <input type="text" id="code" required>
                </div>

                <!-- ឈ្មោះ -->
                <div class="form-group">
                    <label>ឈ្មោះអតិថិជន <span class="required">*</span></label>
                    <input type="text" id="name" required>
                </div>

                <!-- ភេទ -->
                <div class="form-group">
                    <label>ភេទ</label>
                    <select id="gender">
                        <option value="">-- ជ្រើសរើស --</option>
                        <option value="ប្រុស">ប្រុស</option>
                        <option value="ស្រី">ស្រី</option>
                    </select>
                </div>

                <!-- លេខទូរស័ព្ទ -->
                <div class="form-group">
                    <label>លេខទូរស័ព្ទ</label>
                    <input type="text" id="phone" placeholder="ឧ. 012 345 678">
                </div>

                <!-- ថ្ងៃខែឆ្នាំកំណើត -->
                <div class="form-group">
                    <label>ថ្ងៃខែឆ្នាំកំណើត</label>
                    <input type="date" id="dob">
                </div>

                <!-- លេខអត្តសញ្ញាណប័ណ្ណ -->
                <div class="form-group">
                    <label>លេខអត្តសញ្ញាណប័ណ្ណ</label>
                    <input type="text" id="id_card" placeholder="លេខអត្តសញ្ញាណប័ណ្ណ">
                </div>

                <!-- អសយដ្ឋាន -->
                <div class="form-group full-width">
                    <label>អសយដ្ឋាន</label>
                    <input type="text" id="address" placeholder="អសយដ្ឋានបច្ចុប្បន្ន">
                </div>

                <!-- ===== ព័ត៌មានអ្នកធានា ===== -->
                <div class="form-group full-width" style="margin-top: 10px;">
                    <h3 style="color: #f39c12; font-size: 18px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;">
                        👤 ព័ត៌មានអ្នកធានា
                    </h3>
                </div>

                <!-- ឈ្មោះអ្នកធានា -->
                <div class="form-group">
                    <label>ឈ្មោះអ្នកធានា</label>
                    <input type="text" id="guarantor_name" placeholder="ឈ្មោះអ្នកធានា">
                </div>

                <!-- ភេទអ្នកធានា -->
                <div class="form-group">
                    <label>ភេទ (អ្នកធានា)</label>
                    <select id="guarantor_gender">
                        <option value="">-- ជ្រើសរើស --</option>
                        <option value="ប្រុស">ប្រុស</option>
                        <option value="ស្រី">ស្រី</option>
                    </select>
                </div>

                <!-- លេខអត្តសញ្ញាណអ្នកធានា -->
                <div class="form-group">
                    <label>លេខអត្តសញ្ញាណ (អ្នកធានា)</label>
                    <input type="text" id="guarantor_id_card" placeholder="លេខអត្តសញ្ញាណអ្នកធានា">
                </div>

                <!-- ថ្ងៃខែឆ្នាំកំណើតអ្នកធានា -->
                <div class="form-group">
                    <label>ថ្ងៃខែឆ្នាំកំណើត (អ្នកធានា)</label>
                    <input type="date" id="guarantor_dob">
                </div>

                <!-- លេខទូរស័ព្ទអ្នកធានា -->
                <div class="form-group">
                    <label>លេខទូរស័ព្ទ (អ្នកធានា)</label>
                    <input type="text" id="guarantor_phone" placeholder="លេខទូរស័ព្ទអ្នកធានា">
                </div>

                <!-- អសយដ្ឋានអ្នកធានា -->
                <div class="form-group">
                    <label>អសយដ្ឋាន (អ្នកធានា)</label>
                    <input type="text" id="guarantor_address" placeholder="អសយដ្ឋានអ្នកធានា">
                </div>

                <!-- ទំនាក់ទំនង -->
                <div class="form-group">
                    <label>ទំនាក់ទំនង</label>
                    <input type="text" id="relation" placeholder="ឧ. បងប្អូន, មិត្តភក្តិ">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-cancel" onclick="window.location.href='/customers'">❌ បោះបង់</button>
                <button type="submit" class="btn btn-submit" id="submitBtn">💾 រក្សាទុក</button>
            </div>
        </form>
    </div>

    <script>
        // ===== GET CUSTOMER ID FROM URL =====
        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('id');

        // ===== LOAD CUSTOMER DATA =====
        async function loadCustomer() {
            const loadingEl = document.getElementById('loadingMessage');
            const formEl = document.getElementById('editForm');

            try {
                if (!customerId) {
                    showAlert('❌ រកមិនឃើញ ID អតិថិជន!', 'error');
                    loadingEl.innerHTML = '❌ រកមិនឃើញ ID អតិថិជន';
                    return;
                }

                const response = await fetch(`/api/customer/${customerId}`);
                
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('រកមិនឃើញអតិថិជននេះទេ!');
                    }
                    throw new Error('Network response was not ok');
                }
                
                const customer = await response.json();

                if (customer.error) {
                    showAlert('❌ ' + customer.error, 'error');
                    loadingEl.innerHTML = '❌ ' + customer.error;
                    return;
                }

                // Fill form with customer data
                document.getElementById('customer_id').value = customer.id || '';
                document.getElementById('code').value = customer.code || '';
                document.getElementById('name').value = customer.name || '';
                document.getElementById('gender').value = customer.gender || '';
                document.getElementById('phone').value = customer.phone || '';
                document.getElementById('dob').value = customer.dob || '';
                document.getElementById('id_card').value = customer.id_card || '';
                document.getElementById('address').value = customer.address || '';
                document.getElementById('guarantor_name').value = customer.guarantor_name || '';
                document.getElementById('guarantor_gender').value = customer.guarantor_gender || '';
                document.getElementById('guarantor_id_card').value = customer.guarantor_id_card || '';
                document.getElementById('guarantor_dob').value = customer.guarantor_dob || '';
                document.getElementById('guarantor_phone').value = customer.guarantor_phone || '';
                document.getElementById('guarantor_address').value = customer.guarantor_address || '';
                document.getElementById('relation').value = customer.relation || '';

                // Hide loading, show form
                loadingEl.classList.add('hidden');
                formEl.classList.remove('hidden');

            } catch (error) {
                console.error('Error loading customer:', error);
                showAlert('❌ ' + (error.message || 'មានបញ្ហាក្នុងការផ្ទុកទិន្នន័យ!'), 'error');
                loadingEl.innerHTML = '❌ ' + (error.message || 'មានបញ្ហាក្នុងការផ្ទុកទិន្នន័យ');
            }
        }

        // ===== SUBMIT FORM =====
        async function submitForm(event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.innerHTML = '⏳ កំពុងរក្សាទុក...';

            const data = {
                id: document.getElementById('customer_id').value,
                code: document.getElementById('code').value.trim(),
                name: document.getElementById('name').value.trim(),
                gender: document.getElementById('gender').value,
                phone: document.getElementById('phone').value.trim(),
                dob: document.getElementById('dob').value,
                id_card: document.getElementById('id_card').value.trim(),
                address: document.getElementById('address').value.trim(),
                guarantor_name: document.getElementById('guarantor_name').value.trim(),
                guarantor_gender: document.getElementById('guarantor_gender').value,
                guarantor_id_card: document.getElementById('guarantor_id_card').value.trim(),
                guarantor_dob: document.getElementById('guarantor_dob').value,
                guarantor_phone: document.getElementById('guarantor_phone').value.trim(),
                guarantor_address: document.getElementById('guarantor_address').value.trim(),
                relation: document.getElementById('relation').value.trim()
            };

            if (!data.code || !data.name) {
                showAlert('សូមបំពេញ លេខកូដ និង ឈ្មោះអតិថិជន!', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
                return;
            }

            try {
                const response = await fetch('/api/update_customer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('✅ កែប្រែព័ត៌មានជោគជ័យ!', 'success');
                    setTimeout(() => {
                        window.location.href = '/customers';
                    }, 1500);
                } else {
                    showAlert('❌ ' + (result.error || 'មានបញ្ហាក្នុងការកែប្រែ!'), 'error');
                }
            } catch (error) {
                console.error('Error updating customer:', error);
                showAlert('❌ មានបញ្ហាក្នុងការភ្ជាប់ទៅម៉ាស៊ីនមេ!', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalText;
            }
        }

        // ===== SHOW ALERT =====
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            const className = type === 'success' ? 'alert-success' : 'alert-error';
            alertDiv.innerHTML = `<div class="alert ${className}">${message}</div>`;
            
            // Auto hide after 5 seconds
            if (window.alertTimeout) {
                clearTimeout(window.alertTimeout);
            }
            window.alertTimeout = setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }

        // ===== PREVENT DOUBLE SUBMIT =====
        let isSubmitting = false;
        document.getElementById('editForm').addEventListener('submit', function(e) {
            if (isSubmitting) {
                e.preventDefault();
                return;
            }
            isSubmitting = true;
            setTimeout(() => {
                isSubmitting = false;
            }, 3000);
        });

        // ===== LOAD DATA WHEN PAGE LOADS =====
        document.addEventListener('DOMContentLoaded', function() {
            loadCustomer();
        });
    </script>
</body>
</html>
