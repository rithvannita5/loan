<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>បង្កើតកម្ចីថ្មី</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Khmer OS', 'Noto Sans Khmer', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 28px; color: #1a1a2e; }
        .header h1 span { color: #667eea; }
        .header p { color: #888; font-size: 14px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 5px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .form-group label .required {
            color: #e74c3c;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #f8f9fa;
            font-family: 'Khmer OS', 'Noto Sans Khmer', Arial, sans-serif;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .form-group input:disabled, .form-group input[readonly] {
            background: #e9ecef;
            color: #555;
            cursor: not-allowed;
        }
        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 35px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Khmer OS', 'Noto Sans Khmer', Arial, sans-serif;
        }
        .btn-submit {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: #fff;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39,174,96,0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-cancel {
            background: #e74c3c;
            color: #fff;
        }
        .btn-cancel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231,76,60,0.4);
        }
        .btn-calculate {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: #fff;
            padding: 12px 25px;
        }
        .btn-calculate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52,152,219,0.4);
        }
        .btn-calculate:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .schedule-table {
            margin-top: 30px;
            overflow-x: auto;
            border-radius: 15px;
            border: 1px solid #e0e0e0;
        }
        .schedule-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .schedule-table th {
            background: #e9ecef;
            color: #333;
            padding: 12px;
            text-align: center;
            border-bottom: 2px solid #dee2e6;
        }
        .schedule-table td {
            padding: 10px 12px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .schedule-table tr:hover td {
            background: #f8f9ff;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .summary-item {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
        }
        .summary-item .label {
            font-size: 13px;
            color: #888;
        }
        .summary-item .value {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .summary-item .value.primary { color: #667eea; }
        .summary-item .value.success { color: #27ae60; }
        .summary-item .value.danger { color: #e74c3c; }
        .summary-item .value.warning { color: #f39c12; }

        .alert {
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

        .help-text {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 992px) {
            .form-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .container { padding: 20px; }
            .form-actions { flex-direction: column; }
            .btn { width: 100%; text-align: center; }
            .summary { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .summary { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>➕ បង្កើត <span>កម្ចីថ្មី</span></h1>
        <p>សូមបំពេញព័ត៌មានខាងក្រោម</p>
    </div>

    <div id="alertMessage"></div>

    <form id="loanForm" onsubmit="return false;">
        <div class="form-grid">
            <!-- 1. លេខកូដកម្ចី (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>លេខកូដកម្ចី <span class="required">*</span></label>
                <input type="text" id="loan_code" readonly placeholder="កំពុងផ្ទុក...">
            </div>

            <!-- 2. លេខកូដអតិថិជន -->
            <div class="form-group">
                <label>លេខកូដអតិថិជន <span class="required">*</span></label>
                <input type="text" id="customer_search" list="customer_list"
                       placeholder="វាយលេខកូដ ឬឈ្មោះ..."
                       oninput="searchCustomer(this.value)"
                       autocomplete="off">
                <datalist id="customer_list">
                    {% for c in customers %}
                    <option value="{{ c.code }}">{{ c.code }} - {{ c.name }}</option>
                    {% endfor %}
                </datalist>
                <input type="hidden" id="customer_id" value="">
            </div>

            <!-- 3. ឈ្មោះអតិថិជន (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>ឈ្មោះអតិថិជន <span class="required">*</span></label>
                <input type="text" id="customer_name_display" readonly
                       style="background:#e9ecef; cursor:not-allowed;"
                       placeholder="បង្ហាញដោយស្វ័យប្រវត្តិ">
            </div>

            <!-- 4. ភេទ (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>ភេទ</label>
                <input type="text" id="gender" readonly style="background:#e9ecef; cursor:not-allowed;">
            </div>

            <!-- 5. លេខទូរស័ព្ទ (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>លេខទូរស័ព្ទ</label>
                <input type="text" id="phone" readonly style="background:#e9ecef; cursor:not-allowed;">
            </div>

            <!-- 6. អសយដ្ឋាន (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>អសយដ្ឋាន</label>
                <input type="text" id="address" readonly style="background:#e9ecef; cursor:not-allowed;">
            </div>

            <!-- 7. ទឹកប្រាក់កម្ចី -->
            <div class="form-group">
                <label>ទឹកប្រាក់កម្ចី <span class="required">*</span></label>
                <input type="number" id="loan_amount" placeholder="0" step="any" min="0">
            </div>

            <!-- 8. រូបិយប័ណ្ណ -->
            <div class="form-group">
                <label>រូបិយប័ណ្ណ</label>
                <select id="currency">
                    <option value="USD">USD ($)</option>
                    <option value="KHR">រៀល (៛)</option>
                </select>
            </div>

            <!-- 9. ប្រភេទការគណនា -->
            <div class="form-group">
                <label>ប្រភេទការគណនា</label>
                <select id="calc_type">
                    <option value="1">រំលោះបង់ថេរ</option>
                    <option value="2">ដើមថេរ ការថេរ</option>
                    <option value="3">បង់តែការ បង់ថយ</option>
                    <option value="4">បង់តែការប្រាក់</option>
                </select>
            </div>

            <!-- 10. រយៈពេល -->
            <div class="form-group">
                <label>រយៈពេល <span class="required">*</span></label>
                <input type="number" id="duration_num" placeholder="1" value="1" min="1">
            </div>

            <!-- 11. ប្រភេទរយៈពេល -->
            <div class="form-group">
                <label>ប្រភេទរយៈពេល</label>
                <select id="duration_type">
                    <option value="ថ្ងៃ">ថ្ងៃ</option>
                    <option value="សប្តាហ៍">សប្តាហ៍</option>
                    <option value="2 សប្តាហ៍">2 សប្តាហ៍</option>
                    <option value="ខែ">ខែ</option>
                </select>
            </div>

            <!-- 12. អត្រាការប្រាក់ -->
            <div class="form-group">
                <label>អត្រាការប្រាក់ (%)</label>
                <input type="number" id="interest_rate" placeholder="0" value="0" step="0.01" min="0">
            </div>

            <!-- 13. សេវារដ្ឋបាល (%) -->
            <div class="form-group">
                <label>សេវារដ្ឋបាល (%)</label>
                <input type="number" id="service_fee" placeholder="0" value="0" step="0.01" min="0">
            </div>

            <!-- 14. ថ្ងៃខែស្នើបង់ -->
            <div class="form-group">
                <label>ថ្ងៃខែស្នើបង់</label>
                <input type="date" id="due_date">
            </div>

            <!-- 15. វគ្គ (បំណងខ្ចី) -->
            <div class="form-group">
                <label>វគ្គ</label>
                <input type="text" id="purpose" placeholder="បំណងខ្ចី">
            </div>

            <!-- 16. ឈ្មោះអ្នកធានា (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>ឈ្មោះអ្នកធានា</label>
                <input type="text" id="guarantor_name" readonly style="background:#e9ecef; cursor:not-allowed;">
            </div>

            <!-- 17. ភេទអ្នកធានា (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>ភេទ (អ្នកធានា)</label>
                <input type="text" id="guarantor_gender" readonly style="background:#e9ecef; cursor:not-allowed;">
            </div>

            <!-- 18. លេខទូរស័ព្ទអ្នកធានា (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>លេខទូរស័ព្ទ (អ្នកធានា)</label>
                <input type="text" id="guarantor_phone" readonly style="background:#e9ecef; cursor:not-allowed;">
            </div>

            <!-- 19. អសយដ្ឋានអ្នកធានា (ស្វ័យប្រវត្តិ) -->
            <div class="form-group">
                <label>អសយដ្ឋាន (អ្នកធានា)</label>
                <input type="text" id="guarantor_address" readonly style="background:#e9ecef; cursor:not-allowed;">
            </div>

            <!-- 20. ថ្ងៃខែឆ្នាំខ្ចី -->
            <div class="form-group">
                <label>ថ្ងៃខែឆ្នាំខ្ចី</label>
                <input type="date" id="loan_date">
            </div>

            <!-- 21. មន្ត្រី CO -->
            <div class="form-group">
                <label>មន្ត្រី CO</label>
                <select id="co_officer">
                    <option value="">-- ជ្រើសរើសមន្ត្រី --</option>
                </select>
                <small class="help-text">ទិន្នន័យទាញពីបញ្ជីមន្ត្រីឥណទានក្នុង Settings</small>
            </div>
        </div>

        <!-- ===== ACTION ROW ===== -->
        <div class="form-actions">
            <button type="button" class="btn btn-calculate" id="calculateBtn" onclick="calculateLoan()">
                📊 គណនាកម្ចី
            </button>
            <button type="button" class="btn btn-cancel" onclick="window.location.href='/loans'">❌ បោះបង់</button>
            <button type="button" class="btn btn-submit" id="submitBtn" onclick="submitLoan()">💾 រក្សាទុក</button>
        </div>
    </form>

    <!-- Summary -->
    <div id="summary" style="display:none;">
        <div class="summary">
            <div class="summary-item">
                <div class="label">ទឹកប្រាក់សរុប</div>
                <div class="value primary" id="total_payment">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="label">ការប្រាក់សរុប</div>
                <div class="value warning" id="total_interest">$0.00</div>
            </div>
            <div class="summary-item">
                <div class="label">សេវារដ្ឋបាល</div>
                <div class="value success" id="service_amount">$0.00</div>
            </div>
        </div>
    </div>

    <!-- Schedule Table -->
    <div id="scheduleContainer" style="display:none;" class="schedule-table">
        <table>
            <thead>
                <tr>
                    <th>វគ្គ</th>
                    <th>កាលបរិច្ឆេទ</th>
                    <th>ទឹកប្រាក់បង់</th>
                    <th>សមតុល្យ</th>
                </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
        </table>
    </div>
</div>

<script>
    let customerData = {};
    let scheduleData = [];
    let officersData = [];
    let isSubmitting = false;
    let isCalculating = false;

    // ===== LOAD OFFICERS =====
    async function loadOfficers() {
        try {
            const response = await fetch('/api/officers');
            if (!response.ok) throw new Error('Failed to load officers');
            officersData = await response.json();

            const select = document.getElementById('co_officer');
            select.innerHTML = '<option value="">-- ជ្រើសរើសមន្ត្រី --</option>';

            if (officersData && officersData.length > 0) {
                officersData.forEach(officer => {
                    const option = document.createElement('option');
                    option.value = officer.name || '';
                    option.textContent = `${officer.code || ''} - ${officer.name || ''}`;
                    if (officer.name) select.appendChild(option);
                });
            } else {
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'មិនមានមន្ត្រីឥណទាន (សូមបង្កើតក្នុង Settings)';
                option.disabled = true;
                select.appendChild(option);
            }
        } catch (error) {
            console.error('Error loading officers:', error);
            const select = document.getElementById('co_officer');
            select.innerHTML = '<option value="">-- មិនអាចផ្ទុកទិន្នន័យ --</option>';
        }
    }

    // ===== SEARCH CUSTOMER =====
    async function searchCustomer(value) {
        const searchInput = document.getElementById('customer_search');
        const customerIdHidden = document.getElementById('customer_id');

        if (!value || value.length < 1) {
            clearAllCustomerFields();
            customerIdHidden.value = '';
            return;
        }

        // ===== ពិនិត្យថាតើជា Code ដែលមានក្នុង Datalist =====
        const datalist = document.getElementById('customer_list');
        let found = false;
        for (let option of datalist.options) {
            if (option.value === value) {
                found = true;
                break;
            }
        }

        if (found) {
            await loadCustomerByCode(value);
            return;
        }

        // ===== បើមិនឃើញ ស្វែងរកតាម API =====
        try {
            const response = await fetch(`/api/search_customers?q=${encodeURIComponent(value)}&limit=5`);
            if (!response.ok) throw new Error('Network response was not ok');
            const results = await response.json();

            if (results && results.length > 0) {
                const customer = results[0];
                fillCustomerFields(customer);
                searchInput.value = customer.code || value;
                setDefaultDates();
            } else {
                clearAllCustomerFields();
                customerIdHidden.value = '';
                document.getElementById('customer_name_display').value = 'មិនឃើញអតិថិជន';
            }
        } catch (error) {
            console.error('Error searching customer:', error);
        }
    }

    // ===== FILL CUSTOMER FIELDS =====
    function fillCustomerFields(customer) {
        console.log('📋 Filling customer data:', customer);

        document.getElementById('customer_id').value = customer.id || '';
        document.getElementById('customer_name_display').value = customer.name || '';
        document.getElementById('gender').value = customer.gender || '';
        document.getElementById('phone').value = customer.phone || '';
        document.getElementById('address').value = customer.address || '';

        // ===== ព័ត៌មានអ្នកធានា =====
        document.getElementById('guarantor_name').value = customer.guarantor_name || '';
        document.getElementById('guarantor_gender').value = customer.guarantor_gender || '';
        document.getElementById('guarantor_phone').value = customer.guarantor_phone || '';
        document.getElementById('guarantor_address').value = customer.guarantor_address || '';
    }

    // ===== LOAD CUSTOMER BY CODE =====
    async function loadCustomerByCode(code) {
        try {
            const response = await fetch(`/api/search_customers?q=${encodeURIComponent(code)}&limit=1`);
            if (!response.ok) throw new Error('Network response was not ok');
            const results = await response.json();

            if (results && results.length > 0) {
                const customer = results[0];
                fillCustomerFields(customer);
                setDefaultDates();
            } else {
                console.warn('⚠️ No customer found for code:', code);
            }
        } catch (error) {
            console.error('Error loading customer by code:', error);
        }
    }

    // ===== CLEAR ALL CUSTOMER FIELDS =====
    function clearAllCustomerFields() {
        document.getElementById('customer_name_display').value = '';
        document.getElementById('gender').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('address').value = '';
        document.getElementById('guarantor_name').value = '';
        document.getElementById('guarantor_gender').value = '';
        document.getElementById('guarantor_phone').value = '';
        document.getElementById('guarantor_address').value = '';
    }

    // ===== SET DEFAULT DATES =====
    function setDefaultDates() {
        const today = new Date().toISOString().split('T')[0];
        const loanDateInput = document.getElementById('loan_date');
        const dueDateInput = document.getElementById('due_date');

        if (!loanDateInput.value) {
            loanDateInput.value = today;
        }
        if (!dueDateInput.value) {
            const due = new Date();
            due.setDate(due.getDate() + 30);
            dueDateInput.value = due.toISOString().split('T')[0];
        }
    }

    // ===== GENERATE LOAN CODE (បានកែ - ដំណើរការត្រឹមត្រូវ) =====
    async function generateLoanCode() {
        const loanCodeInput = document.getElementById('loan_code');
        loanCodeInput.value = 'កំពុងផ្ទុក...';

        try {
            console.log('🔄 Fetching loan code...');
            const response = await fetch('/api/generate_loan_code');

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            console.log('✅ Loan code received:', data);

            if (data.loan_code) {
                loanCodeInput.value = data.loan_code;
            } else if (data.code) {
                loanCodeInput.value = data.code;
            } else {
                loanCodeInput.value = 'LN-0001';
            }
        } catch (error) {
            console.error('❌ Error generating loan code:', error);
            // ===== Fallback: បង្កើតលេខកូដដោយខ្លួនឯង =====
            const fallbackCode = 'LN-' + String(Date.now()).slice(-4);
            loanCodeInput.value = fallbackCode;
        }
    }

    // ===== CALCULATE LOAN =====
    async function calculateLoan() {
        if (isCalculating) return;

        const calculateBtn = document.getElementById('calculateBtn');
        const originalText = calculateBtn.innerHTML;

        isCalculating = true;
        calculateBtn.disabled = true;
        calculateBtn.innerHTML = '⏳ <span class="spinner"></span> កំពុងគណនា...';

        try {
            const customerId = document.getElementById('customer_id').value;
            const loanAmount = parseFloat(document.getElementById('loan_amount').value) || 0;
            const interestRate = parseFloat(document.getElementById('interest_rate').value) || 0;
            const durationNum = parseInt(document.getElementById('duration_num').value) || 1;
            const calcType = parseInt(document.getElementById('calc_type').value) || 1;
            const serviceFee = parseFloat(document.getElementById('service_fee').value) || 0;
            const currency = document.getElementById('currency').value;
            const durationType = document.getElementById('duration_type').value;
            const loanDate = document.getElementById('loan_date').value || new Date().toISOString().split('T')[0];

            let totalDays = durationNum;
            if (durationType === 'សប្តាហ៍') totalDays = durationNum * 7;
            else if (durationType === '2 សប្តាហ៍') totalDays = durationNum * 14;
            else if (durationType === 'ខែ') totalDays = durationNum * 30;

            if (!customerId) {
                showAlert('សូមជ្រើសរើសអតិថិជនជាមុនសិន!', 'error');
                return;
            }

            if (loanAmount <= 0) {
                showAlert('សូមបញ្ចូលទឹកប្រាក់កម្ចី!', 'error');
                return;
            }

            if (totalDays <= 0) {
                showAlert('សូមបញ្ចូលចំនួនថ្ងៃឲ្យបានត្រឹមត្រូវ!', 'error');
                return;
            }

            const response = await fetch('/api/calculate_loan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    loan_amount: loanAmount,
                    interest_rate: interestRate,
                    duration_num: totalDays,
                    calc_type: calcType,
                    service_fee: serviceFee,
                    currency: currency,
                    duration_type: 'ថ្ងៃ',
                    start_date: loanDate
                })
            });

            if (!response.ok) throw new Error('Network response was not ok');
            const result = await response.json();
            scheduleData = result.schedule || [];

            document.getElementById('summary').style.display = 'block';
            document.getElementById('total_payment').textContent = formatCurrency(result.total_payment, currency);
            document.getElementById('total_interest').textContent = formatCurrency(result.total_interest, currency);
            document.getElementById('service_amount').textContent = formatCurrency(result.service_amount, currency);

            renderSchedule(scheduleData, currency);

            if (scheduleData.length > 0) {
                showAlert(`✅ គណនាជោគជ័យ! បង្ហាញ ${scheduleData.length} វគ្គ`, 'success');
            }

        } catch (error) {
            console.error('Error calculating loan:', error);
            showAlert('❌ មានបញ្ហាក្នុងការគណនា! ' + error.message, 'error');
        } finally {
            isCalculating = false;
            calculateBtn.disabled = false;
            calculateBtn.innerHTML = originalText;
        }
    }

    // ===== RENDER SCHEDULE =====
    function renderSchedule(schedule, currency) {
        const container = document.getElementById('scheduleContainer');
        const tbody = document.getElementById('scheduleBody');
        tbody.innerHTML = '';

        if (!schedule || schedule.length === 0) {
            container.style.display = 'none';
            return;
        }

        container.style.display = 'block';

        schedule.forEach((item, index) => {
            const tr = document.createElement('tr');

            // ===== បង្ហាញ due_date ពី Server =====
            let dueDate = item.due_date || '-';
            if (dueDate !== '-') {
                try {
                    const d = new Date(dueDate + 'T00:00:00');
                    dueDate = d.toLocaleDateString('km-KH');
                } catch (e) {}
            }

            tr.innerHTML = `
                <td>${item.period}</td>
                <td>${dueDate}</td>
                <td>${formatCurrency(item.payment, currency)}</td>
                <td>${formatCurrency(item.balance, currency)}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ===== FORMAT CURRENCY =====
    function formatCurrency(amount, currency) {
        if (amount === null || amount === undefined || isNaN(amount)) {
            return currency === 'KHR' ? '៛ 0' : '$ 0.00';
        }

        if (currency === 'KHR') {
            const rounded = Math.round(amount / 100) * 100;
            return '៛ ' + rounded.toLocaleString('en-US');
        } else {
            return '$ ' + amount.toFixed(2);
        }
    }

    // ===== SUBMIT LOAN =====
    async function submitLoan() {
        if (isSubmitting) return;

        const submitBtn = document.getElementById('submitBtn');
        const originalText = submitBtn.innerHTML;

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '⏳ <span class="spinner"></span> កំពុងរក្សាទុក...';

        try {
            const customerId = document.getElementById('customer_id').value;
            const loanAmount = parseFloat(document.getElementById('loan_amount').value) || 0;
            const currency = document.getElementById('currency').value;
            const interestRate = parseFloat(document.getElementById('interest_rate').value) || 0;
            const durationNum = parseInt(document.getElementById('duration_num').value) || 1;
            const durationType = document.getElementById('duration_type').value;
            const calcType = parseInt(document.getElementById('calc_type').value) || 1;
            const serviceFee = parseFloat(document.getElementById('service_fee').value) || 0;
            const loanDate = document.getElementById('loan_date').value;
            const dueDate = document.getElementById('due_date').value;
            const coOfficer = document.getElementById('co_officer').value;
            const purpose = document.getElementById('purpose').value;
            const loanCode = document.getElementById('loan_code').value;

            let totalDays = durationNum;
            if (durationType === 'សប្តាហ៍') totalDays = durationNum * 7;
            else if (durationType === '2 សប្តាហ៍') totalDays = durationNum * 14;
            else if (durationType === 'ខែ') totalDays = durationNum * 30;

            let totalInterest = 0;
            let totalAmount = 0;
            let remainingBalance = loanAmount;

            totalInterest = loanAmount * (interestRate / 100) * totalDays;
            totalAmount = loanAmount + totalInterest;
            remainingBalance = totalAmount;

            if (currency === 'KHR') {
                totalInterest = Math.round(totalInterest / 100) * 100;
                totalAmount = Math.round(totalAmount / 100) * 100;
                remainingBalance = totalAmount;
            }

            if (scheduleData && scheduleData.length > 0) {
                const last = scheduleData[scheduleData.length - 1];
                totalAmount = last.balance + last.principal + last.interest;
                totalInterest = scheduleData.reduce((sum, s) => sum + s.interest, 0);
                remainingBalance = last.balance || 0;
            }

            const data = {
                customer_id: parseInt(customerId),
                loan_code: loanCode,
                loan_amount: loanAmount,
                currency: currency,
                interest_rate: interestRate,
                duration_num: totalDays,
                duration_type: durationType,
                calc_type: calcType,
                service_fee: serviceFee,
                service_fee_amount: loanAmount * serviceFee / 100,
                insurance_fee: 0,
                insurance_amount: 0,
                loan_date: loanDate,
                due_date: dueDate,
                co_officer: coOfficer,
                purpose: purpose,
                total_interest: totalInterest,
                total_amount: totalAmount || loanAmount,
                amount_paid: 0,
                remaining_balance: remainingBalance || loanAmount,
                status: 'Pending'
            };

            if (!customerId || loanAmount <= 0) {
                showAlert('សូមជ្រើសរើសអតិថិជន និងបញ្ចូលទឹកប្រាក់កម្ចី!', 'error');
                return;
            }

            const response = await fetch('/api/create_loan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.success) {
                showAlert('✅ បង្កើតកម្ចីថ្មីជោគជ័យ!', 'success');
                document.getElementById('loan_amount').value = '';
                document.getElementById('interest_rate').value = '0';
                document.getElementById('duration_num').value = '1';
                document.getElementById('service_fee').value = '0';
                document.getElementById('purpose').value = '';
                scheduleData = [];
                document.getElementById('summary').style.display = 'none';
                document.getElementById('scheduleContainer').style.display = 'none';

                // ===== Generate new code =====
                await generateLoanCode();

                setTimeout(() => {
                    window.location.href = '/loans';
                }, 2000);
            } else {
                showAlert('❌ ' + (result.error || 'មានបញ្ហាក្នុងការបង្កើតកម្ចី!'), 'error');
            }
        } catch (error) {
            console.error('Error submitting loan:', error);
            showAlert('❌ មានបញ្ហាក្នុងការភ្ជាប់ទៅម៉ាស៊ីនមេ!', 'error');
        } finally {
            isSubmitting = false;
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    }

    // ===== SHOW ALERT =====
    function showAlert(message, type) {
        const alertDiv = document.getElementById('alertMessage');
        const className = type === 'success' ? 'alert-success' : type === 'info' ? 'alert-info' : 'alert-error';
        alertDiv.innerHTML = `<div class="alert ${className}">${message}</div>`;

        if (window.alertTimeout) {
            clearTimeout(window.alertTimeout);
        }

        window.alertTimeout = setTimeout(() => {
            alertDiv.innerHTML = '';
        }, 5000);
    }

    // ===== EVENT LISTENERS =====
    document.addEventListener('DOMContentLoaded', function() {
        // ===== Generate Loan Code ភ្លាមៗ =====
        generateLoanCode();
        setDefaultDates();
        loadOfficers();

        // ===== Search Customer on Enter =====
        document.getElementById('customer_search').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                searchCustomer(this.value);
            }
        });

        // ===== Clear on Blur =====
        document.getElementById('customer_search').addEventListener('blur', function() {
            if (!this.value) {
                clearAllCustomerFields();
                document.getElementById('customer_id').value = '';
            }
        });

        // ===== Auto Calculate on Input Change =====
        let calcTimeout;
        const fields = ['loan_amount', 'interest_rate', 'duration_num', 'duration_type', 'calc_type', 'service_fee', 'currency'];
        fields.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', function() {
                    clearTimeout(calcTimeout);
                    calcTimeout = setTimeout(() => {
                        if (document.getElementById('customer_id').value) {
                            calculateLoan();
                        }
                    }, 800);
                });
                el.addEventListener('change', function() {
                    clearTimeout(calcTimeout);
                    calcTimeout = setTimeout(() => {
                        if (document.getElementById('customer_id').value) {
                            calculateLoan();
                        }
                    }, 300);
                });
            }
        });

        // ===== Recalculate Loan Code ពេល Focus =====
        document.getElementById('loan_code').addEventListener('focus', function() {
            if (!this.value || this.value === 'កំពុងផ្ទុក...') {
                generateLoanCode();
            }
        });
    });
</script>
